<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6b1020">
<title>মহাভক্তি – MahaBhakti</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: 24px; color: #fff8e9;
  font-family: system-ui, -apple-system, "Noto Sans Bengali", "Nirmala UI", sans-serif;
  background: radial-gradient(ellipse at top, #8f2634 0%, #3a0c1b 48%, #160910 100%);
}
.card {
  width: min(100%, 480px); padding: 34px 24px; text-align: center;
  border: 1px solid rgba(255,220,150,.48); border-radius: 28px;
  background: rgba(25, 7, 14, .76); box-shadow: 0 20px 70px #0008;
}
.symbol { font-size: 42px; line-height: 1.2; }
h1 { margin: 12px 0 4px; font-size: clamp(28px, 7vw, 38px); color: #ffdf91; }
.sub { margin: 0 0 24px; color: #f5dfc3; }
.intro { line-height: 1.7; color: #f7e9dc; margin-bottom: 24px; }
.links { display: grid; gap: 13px; }
a {
  display: block; padding: 15px 18px; border-radius: 14px; text-decoration: none;
  color: #32101a; background: linear-gradient(135deg, #ffe6a7, #eebd65);
  font-size: 17px; font-weight: 750; box-shadow: 0 5px 18px #0003;
}
a:focus, a:hover { outline: 2px solid white; outline-offset: 3px; }
footer { margin-top: 25px; font-size: 14px; color: #e8c9c4; }
</style>
</head>
<body>
<main class="card">
  <div class="symbol">🙏 🪔 🔱</div>
  <h1>মহাভক্তি</h1>
  <div class="sub">MahaBhakti</div>
  <p class="intro">সনাতন ধর্ম, ভক্তি ও আধ্যাত্মিকতার পথে আমাদের সঙ্গে যুক্ত থাকুন।<br>আপনার পছন্দের প্ল্যাটফর্ম বেছে নিন।</p>
  <nav class="links" aria-label="MahaBhakti social media">
    <a href="https://www.facebook.com/share/19vLyfoeba/" target="_blank" rel="noopener noreferrer">📘 Facebook Page</a>
    <a href="https://www.instagram.com/mahabhakti022/" target="_blank" rel="noopener noreferrer">📸 Instagram</a>
    <a href="https://youtube.com/@mahabhaktiofficial" target="_blank" rel="noopener noreferrer">▶️ YouTube Channel</a>
  </nav>
  <footer>জয় শ্রীকৃষ্ণ • হর হর মহাদেব • জয় মা দুর্গা</footer>
</main>
</body>
</html>
